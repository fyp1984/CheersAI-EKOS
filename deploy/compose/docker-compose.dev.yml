# EKOS 共用层 · E0 本机开发环境依赖服务
#
# 关键约束（三条，别改）：
#   1. platform: linux/arm64 —— 本机 Docker Desktop 默认拉 amd64（Rosetta 模拟），
#      实测比原生慢数倍。开发期必须显式指定 arm64。
#   2. 端口用 18xxx/15xxx/19xxx 段 —— 交付冻结端口（8080/8000/8001/8002/5432/6379/9000/9001）
#      见 60.90.03 §3.8，开发环境避开，防止"本机跑通、交付冲突"。
#   3. 只用 Compose Spec 通用语法 —— 本机 Compose 版本高于交付冻结的 2.29.7，
#      禁用新版专有字段，否则甲方环境解析失败。

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 10

services:

  # ---------------- 事实与向量库 ----------------
  postgres:
    image: pgvector/pgvector:pg16          # 交付冻结 PostgreSQL 16.6 + pgvector 0.8.0
    platform: linux/arm64                   # ← E0 关键；E1 改为 linux/amd64
    profiles: [dev]
    container_name: ekos-postgres
    environment:
      POSTGRES_DB: ${PGDATABASE:-ekos}
      POSTGRES_USER: ${PGUSER:-ekos}
      POSTGRES_PASSWORD: ${PGPASSWORD:-ekos_dev_only}
    ports:
      - "${PGPORT_HOST:-15432}:5432"        # ← 避开冻结端口 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-ekos} -d ${PGDATABASE:-ekos}"]
      <<: *healthcheck-defaults

  # ---------------- 任务队列 ----------------
  redis:
    image: redis:7.4.1                      # 交付冻结版本
    platform: linux/arm64
    profiles: [dev]
    container_name: ekos-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb"]
    ports:
      - "${REDISPORT_HOST:-16379}:6379"     # ← 避开冻结端口 6379
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-defaults

  # ---------------- 对象存储 ----------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z   # 交付冻结版本
    platform: linux/arm64
    profiles: [dev]
    container_name: ekos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-ekos}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-ekos_dev_only}
    ports:
      - "${MINIO_API_HOST:-19000}:9000"     # ← 避开冻结端口 9000
      - "${MINIO_CONSOLE_HOST:-19001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      <<: *healthcheck-defaults

  # ---------------- 模型契约 Stub ----------------
  # E0 专用：M2 无 NVIDIA GPU，vLLM 无法运行。
  # 该服务严格模拟 60.90.03 §3.6 冻结契约（OpenAI-compatible / 双 Profile / Token 上限）。
  # 产出结果必须带 stub 标记，性能数字一律无效。
  model-stub:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.stub
    platform: linux/arm64
    profiles: [dev, stub]
    container_name: ekos-model-stub
    ports:
      - "${MODEL_HOST:-18000}:8000"         # ← 避开冻结端口 8000
    environment:
      STUB_PROFILE: report
      STUB_MAX_TOKENS: "4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      <<: *healthcheck-defaults

volumes:
  pgdata:
  redisdata:
  miniodata:
