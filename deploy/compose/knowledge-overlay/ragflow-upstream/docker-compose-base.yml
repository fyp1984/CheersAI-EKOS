services:
  es01:
    profiles:
      - elasticsearch
    image: elasticsearch:${STACK_VERSION}
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    # Official ES image ACL on /tmp denies writes for user elasticsearch (r-x only).
    # entrypoint.sh needs a writable temp dir for bash here-documents.
    tmpfs:
      - /tmp:mode=1777,size=512m
    # [EKOS 2026-10-15] ports 已移除：本平台不对宿主暴露该服务端口，
    #   唯一对外入口是 ekos-ragflow-proxy 的宿主 :19380。
    env_file: .env
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow
    restart: unless-stopped

  mysql:
    # mysql:5.7 linux/arm64 image is unavailable.
    image: mysql:8.0.39
    env_file: .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
    command:
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --tls_version="TLSv1.2,TLSv1.3"
      --init-file /data/application/init.sql
      --binlog_expire_logs_seconds=604800
    # [EKOS 2026-10-15] ports 已移除：本平台不对宿主暴露该服务端口，
    #   唯一对外入口是 ekos-ragflow-proxy 的宿主 :19380。
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/data/application/init.sql
    networks:
      - ragflow
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    command: ["server", "--console-address", ":9001", "/data"]
    # [EKOS 2026-10-15] ports 已移除：本平台不对宿主暴露该服务端口，
    #   唯一对外入口是 ekos-ragflow-proxy 的宿主 :19380。
    env_file: .env
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - ragflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 120

  redis:
    # swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/valkey/valkey:8
    image: valkey/valkey:8
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    env_file: .env
    # [EKOS 2026-10-15] ports 已移除：本平台不对宿主暴露该服务端口，
    #   唯一对外入口是 ekos-ragflow-proxy 的宿主 :19380。
    volumes:
      - redis_data:/data
    networks:
      - ragflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 120


  # [EKOS 2026-10-15 裁剪] 其余 8 个服务（opensearch01 / infinity / oceanbase /
  #   seekdb / sandbox-executor-manager / nats / tei-cpu / tei-gpu / kibana）本平台不用，
  #   且它们的 image 标签均为 latest，违反本仓 TR-4「版本零漂移」。故整段移除；
  #   将来若需要，须按 TR-4 锁死版本后重新引入。

volumes:
  esdata01:
  mysql_data:
  minio_data:
  redis_data:

  # [EKOS 2026-10-15 裁剪] 其余数据卷随未用服务一并移除。

networks:
  ragflow:
    driver: bridge
