# EKOS 共用层 · 提交前自动拦截
# 安装：uv tool install pre-commit==4.6.2 && pre-commit install
# 用 uv tool 而非 brew：与项目 uv 工具链一致、版本可锁、不污染系统 Python。
#
# 设计原则：只挂「秒级」检查。
# 慢检查（L3/L4）挂在这里，人会想办法 --no-verify 跳过 —— 那等于亲手废掉门禁。

repos:
  # ---------- 基础卫生 ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key          # 防私钥误入仓库

  # ---------- Lint + Format ----------
  # rev 必须与 pyproject.toml 的 ruff 精确版本对齐（当前 dev 组 ruff==0.16.5）。
  # 版本不一致 = pre-commit 格式化结果与 make fmt 不一致，提交时钩子改文件不暂存形成死循环。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ---------- 类型 ----------
  - repo: local
    hooks:
      - id: mypy
        name: mypy (类型检查)
        entry: uv run mypy
        language: system
        types: [python]
        # 不传路径：传路径会覆盖 pyproject 的 files/exclude，
        # 与 make type 的口径不一致（10 个文件 vs 17 个）。作用域统一交给配置。
        pass_filenames: false

      # ---------- 项目门禁（核心）----------
      # 判据源：tools/gate/gate_baseline.json（唯一，改它等于改门禁）
      - id: gate-check
        name: 门禁常检（TR-1/2/4/6/7/8）
        entry: uv run python tools/gate/gate_check.py auto
        language: system
        pass_filenames: false
        # 任一条 FAIL 即阻断提交；WARN 不阻断（如组件未落地）
        stages: [pre-commit, pre-push]
# 注：TR-7（端口零硬编码）与 TR-8（样本零真实数据）曾以独立钩子形式挂在这里。
# 2026-09-03 正式化后并入 gate_check.py —— 判据统一收在 gate_baseline.json 一处。
# 留着独立钩子会形成「两个实现、两套判据」的双口径：改了判据，钩子那一套不会跟着变，
# 而提交时看到的是钩子的绿。检查清单只在一处定义：AUTO_CHECKS。
