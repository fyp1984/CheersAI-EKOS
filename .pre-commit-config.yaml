# EKOS 共用层 · 提交前自动拦截
# 安装：uv tool install pre-commit==4.6.2 && pre-commit install
# 用 uv tool 而非 brew：与项目 uv 工具链一致、版本可锁、不污染系统 Python。
#
# 设计原则：只挂「秒级」检查。
# 慢检查（L3/L4）挂在这里，人会想办法 --no-verify 跳过 —— 那等于亲手废掉门禁。

repos:
  # ---------- 基础卫生 ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key          # 防私钥误入仓库

  # ---------- Lint + Format ----------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ---------- 类型 ----------
  - repo: local
    hooks:
      - id: mypy
        name: mypy (类型检查)
        entry: uv run mypy
        language: system
        types: [python]
        # 不传路径：传路径会覆盖 pyproject 的 files/exclude，
        # 与 make type 的口径不一致（10 个文件 vs 17 个）。作用域统一交给配置。
        pass_filenames: false

      # ---------- 项目门禁（核心）----------
      # 判据源：tools/gate/gate_baseline.json（唯一，改它等于改门禁）
      - id: gate-check
        name: 门禁常检（TR-1/TR-2/TR-4/TR-6）
        entry: uv run python tools/gate/gate_check.py auto
        language: system
        pass_filenames: false
        # 任一条 FAIL 即阻断提交；WARN 不阻断（如组件未落地）
        stages: [pre-commit, pre-push]

      - id: no-hardcoded-port
        name: 禁止硬编码交付端口（候选 TR-7，待拍板）
        entry: bash -c '
          if grep -rnE "(localhost|127\.0\.0\.1):(8080|8000|8001|8002|5432|6379|9000)\b" \
               apps packages deploy/compose 2>/dev/null; then
            echo "❌ 检测到硬编码交付端口。请改用环境变量注入（见 .env.example）";
            exit 1;
          fi'
        language: system
        pass_filenames: false

      - id: no-real-sample
        name: fixtures 目录零真实样本（候选 TR-8，待拍板）
        entry: bash -c '
          if find deploy/fixtures -type f 2>/dev/null | xargs -I{} grep -lE \
               "[0-9]{17}[0-9Xx]|[0-9]{16,19}|[0-9A-HJ-NPQRTUWXY]{18}" {} 2>/dev/null \
               | grep -q .; then
            echo "❌ fixtures 中疑似存在真实敏感标识（身份证/银行卡/统一社会信用代码）";
            exit 1;
          fi'
        language: system
        pass_filenames: false
