# 别名表（按语种组织）
#
# 用途：检索层的查询扩展与同义归一 —— 同一实体的不同写法收敛到同一个 canonical，
# 否则「股份公司」查不到「股份有限公司」的语料。
#
# 内容状态：待业务确认。
#   下面几条是**结构与写法示例**，不是业务定稿。真实别名表必须由信审业务专家
#   用真实语料确认后回填（排期中属 B4 输入）。
#   这里刻意保留少量示例而不是留空数组：空表看不出结构对不对，
#   而结构错了，回填再多内容也是错的结构。
version: 1

languages:
  zh:
    aliases:
      # 组织形式归一（通用工商表述，非行业特有）
      - canonical: 股份有限公司
        variants: ["股份公司", "股份有限公司"]
      - canonical: 有限责任公司
        variants: ["有限公司", "有限责任公司"]
      # 年份写法归一（供时间类查询）
      - canonical: 2025年
        variants: ["二零二五年", "二〇二五年", "2025 年"]
