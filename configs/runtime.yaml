# 运行时语种配置（共用层）
#
# 为什么语种默认值写在配置里、不写在代码里
# ----------------------------------------
# 本期只处理中文。若把默认值写成代码常量（DEFAULT_LANGUAGE = "zh"），
# 加一个语种就要改代码、发版本 —— 那我们对甲方说的
# 「加一个语种是加配置，不是改系统」就成了一句假话。
#
# 同理，document/schema.py 里的 language 是**开放字符串**（ISO 639-1 模式校验），
# 不是封闭枚举：枚举一闭合，语种列表就焊死在代码里，留口子等于没留。
#
# 已知边界（别误读）：
#   supported_languages 当前**仅作登记**，schema 不拿它做白名单校验。
#   一旦拿它校验，加语种就要先改这里再改别处，反而多一道耦合。
#   若下期确实需要白名单，应改为「配置即权威」的单点来源，而不是叠一层校验。
version: 1

default_language: zh

supported_languages:
  - zh
