# 检索引擎配置（T-C1）
#
# 三种检索引擎：keyword / vector / graph
# 配置驱动：换引擎只改这里，不改 packages/retrieval/ 代码（T-C1 判据）。
version: 1

default_language: zh

engines:
  keyword:
    enabled: true
    provider: in-memory              # E0：内存倒排索引；E1 换 pgvector/meilisearch
    weight: 1.0                      # RRF 下三路独立排好序后融合，权重仍走配置（默认 1.0）
    params:
      min_token_chars: 1
      case_sensitive: false

  vector:
    enabled: true
    # P-10 续作2：tei/http = 真 embedding bge-m3 (TEI cpu-1.8, OpenAI兼容 /v1/embeddings)
    # TEI 服务未启动时自动降级为内存 minhash 伪向量（不导致整体 fail）
    # E0 演示端口: 18001，契约交付端口: 8001（优先读环境变量 EMBEDDING_HOST）
    provider: tei/http
    weight: 1.0
    params:
      embedding_dim: 1024           # bge-m3 float32 真实维度（与权重文件 config.json hidden_size 对齐）
      similarity: cosine
      host_from_env: EMBEDDING_HOST # 环境变量优先（E1 compose 组网时写；E0 本机演示：export EMBEDDING_HOST=http://127.0.0.1:18001）
      host: http://127.0.0.1:18001  # 默认回退：E0 本机演示态 TEI
      model: bge-m3
      max_batch_items: 32           # 服务端 max_client_batch_size 上限（SevenSmile TEI 默认 32）；超限会被直接拒绝 → 整批降级为伪向量

  graph:
    enabled: true
    provider: in-memory              # E0：实体关联邻接；E1 换 Neo4j
    weight: 0.3                      # 100Q+26Q v17 验证：k=60 g=0.3 两次独立稳定 Recall=0.60~0.61（g=0.25 仅单次 0.649 不可复现）
    params:
      max_hops: 2

  reranker:
    enabled: true                    # ⚠️ 无效开关：代码未读取该字段；reranker 实际启停只由 RERANKER_HOST 环境变量决定
    provider: cross-encoder/http    # E0：本机 bge-reranker-v2-m3 CrossEncoder MPS；E1 换 TEI reranker 集群
    weight: 1.0
    params:
      host_from_env: RERANKER_HOST   # 环境变量优先（E1 compose 组网时写；E0 本机：export RERANKER_HOST=http://127.0.0.1:18002）
      host: http://127.0.0.1:18002   # E0 本机演示态兜底（代码层若检测到 host:port 字面量则忽略 yaml，走 env）
      top_n: 20                      # v18k：20 基线（v18j 50 导致通用目录 chunk 挤占 top-8，Recall 降 0.04）
      timeout_sec: 30                # MPS 冷启动首次 CrossEncoder 编译需 10–20s，留够余量

# 混合检索参数（PRD §T-C4 要求 L2 + L4 融合排序，使用 RRF）
hybrid:
  top_k_per_engine: 20               # 每路召回 Top 20（v18r 标定：466 chunks×3路 噪声最少且 evidence 进池率最高；v18t扩50会引入无关chunk挤压正确证据，Recall降0.06）
  dedupe: true                       # 同 asset+chunk 只保留最高分
  evidence_required: true            # T-C5：每条 hit 必须有 evidence（哪怕是空串也要给）
  fusion:
    strategy: rrf                    # weighted_sum（旧）/ rrf（L4 融合排序，PRD 指定）
    rrf_k: 60                         # RRF 公式 1/(k + rank) 中的 k；100Q 标定：k=30 回退，k=60 graph=0.3 时 Recall=0.574 最优
    weights_from_config: true        # RRF 乘配置中的 engine.weight（graph=0.3/kw=1.0/vec=1.0，100Q 标定最优起点）

# 拒答策略（T-C5：拒答 100% 说清原因；P-10 T-C4 三路共识拒答）
refusal:
  reason_when_no_index: "检索索引尚未加载（当前环境 E0 stub），无证据可召回"
  reason_when_all_filtered: "召回结果已全部被权限过滤，当前账号无访问权限"
  reason_when_low_score: "Top-k 相似度均低于阈值，证据不足"
  min_score_threshold: 0.001          # 次防线：RRF 融合分阈值（E0 stub 区间紧，仅兜底）
  min_consensus_engines: 2            # 主防线 v18r：双路共识（kw+vec至少两路命中；拒答再由四维盒裁决，R类漏拒率最低=0/20；v18t放宽到1会导致R类单路词法漏匹配就放行，拒答率1.0→0.90）
  # 以下保留兼容/兜底，当前主信号为 consensus
  min_keyword_raw_score: 0.10
  min_any_engine_raw: 0.01
  min_keyword_match_ratio: 0.10
