# 切分规则（按语种组织）
#
# 为什么按语种分：中文没有空格分词，按字符数与标点切；拉丁语系按词与空白切。
# 粒度写死在代码里，下期加语种就要改代码；落在这张表里，加语种就是加一段。
#
# 取值状态：待标定。
#   下列数字是按「中文 1 字 ≈ 1.5 token、英文 1 词 ≈ 1.3 token」粗估的起点值，
#   **尚未用真实样本标定**。Q3 出口（检索打通）须用 X6 题库实测回填。
#   回填前，这些数字不得作为对外承诺的性能依据 —— 结构与数值要分开看：
#   结构（按语种组织、可被 schema 消费）是真在的，数值只是占位。
version: 1

# 兜底：语种未在 languages 中登记时使用
default:
  max_chars: 1200
  overlap_chars: 120
  min_chars: 80
  separators: []
  # 停用词：对 overlap score 和 实体提取 生效；default 档给最常见通用虚词
  stop_words:
    - the
    - a
    - an
    - and
    - or
    - of
    - to
    - in
    - is
    - are
    - was
    - were
    - be
    - been
    - being
    - for
    - with
    - on
    - at
    - from
    - as
    - this
    - that
    - these
    - those
    - by

languages:
  zh:
    max_chars: 800
    overlap_chars: 80
    min_chars: 40
    separators: ["。", "；", "！", "？", "\n\n"]
    # 中文按字符计：800 字符与拉丁语系 1200 字符的 token 量大致相当
    # 停用词：中文常见虚词，用于降低 overlap score 的噪声（P-10 T-C4）
    stop_words:
      - "的"
      - "了"
      - "与"
      - "是"
